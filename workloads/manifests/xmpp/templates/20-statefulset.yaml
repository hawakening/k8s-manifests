apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hawakening-xmpp
  namespace: {{ .Release.Namespace }}
  labels:
    app: hawakening-xmpp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  serviceName: hawakening-xmpp-headless
  selector:
    matchLabels:
      app: hawakening-xmpp
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hawakening-xmpp
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/10-config-map.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 9000
        runAsGroup: 9000
        fsGroup: 9000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ejabberd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: xmpp-client
              containerPort: 5222
              protocol: TCP
            - name: http-api
              containerPort: 5280
              protocol: TCP
          env:
            - name: EJABBERD_MACRO_HOST
              value: xmpp.hawakening.com
            - name: REGISTER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSecret.name }}
                  key: {{ .Values.adminSecret.passwordKey }}
            - name: HAWKEN_USER_LOOKUP_URL
              value: {{ .Values.auth.userLookupUrl | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - ejabberdctl
                - status
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - ejabberdctl
                - status
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - ejabberdctl
                - status
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /opt/ejabberd/conf/ejabberd.yml
              subPath: ejabberd.yml
              readOnly: true
            - name: jwt-public-key
              mountPath: /opt/ejabberd/auth
              readOnly: true
            - name: data
              mountPath: /opt/ejabberd/database
            - name: logs
              mountPath: /opt/ejabberd/logs
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      volumes:
        - name: config
          configMap:
            name: hawakening-xmpp-config
        - name: jwt-public-key
          configMap:
            name: hawakening-xmpp-config
            defaultMode: 0444
            items:
              - key: jwt-public.jwk
                path: jwt-public.jwk
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
{{ toYaml .Values.persistence.accessModes | indent 10 }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
