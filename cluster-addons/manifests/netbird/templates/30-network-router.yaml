# Routing peers that forward NetBird traffic to ClusterIP services.
# Creates the network "hwkn-prod" in NetBird and a DNS record per NetworkResource in the
# referenced zone: <service>.<namespace>.int.hwkn.dev
# The DNS zone must be created in the NetBird dashboard first (DNS > Zones), see README.md.
---
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: hwkn-prod
  namespace: netbird
spec:
  dnsZoneRef:
    name: int.hwkn.dev
  logLevel: info
  workloadOverride:
    # Routing peers are spread across nodes; 2 is enough for a small cluster (operator default is 3).
    replicas: 2
