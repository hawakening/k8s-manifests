# Routing peers that forward NetBird traffic to ClusterIP services.
# Creates the network "hwkn-prod" in NetBird and a DNS record per NetworkResource in the
# referenced zone: <service>.<namespace>.hwkn.internal
# Friendly names (argocd.hwkn.internal, ...) are CNAMEs added by hand in the dashboard, see README.md.
# The DNS zone must be created in the NetBird dashboard first (DNS > Zones).
---
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: hwkn-prod
  namespace: netbird
spec:
  dnsZoneRef:
    name: hwkn.internal
  logLevel: info
  workloadOverride:
    # Routing peers are spread across nodes; 2 is enough for a small cluster (operator default is 3).
    replicas: 2
