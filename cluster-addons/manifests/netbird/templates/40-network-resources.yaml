# Internal services exposed to the NetBird network.
# A NetworkResource must live in the same namespace as the Service it references and the
# Service must be of type ClusterIP. The operator creates the A record
# <service>.<namespace>.int.hwkn.dev.
---
# The internal Traefik ingress (80/443). All *.int.hwkn.dev hosts are a wildcard CNAME to
# traefik.traefik.int.hwkn.dev (added by hand in the NetBird dashboard, see README.md), so
# services are exposed with an Ingress (ingressClassName: internal), not a NetworkResource.
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: traefik
  namespace: traefik
spec:
  networkRouterRef:
    name: hwkn-prod
    namespace: netbird
  serviceRef:
    name: traefik
  groups:
    - name: k8s-services
