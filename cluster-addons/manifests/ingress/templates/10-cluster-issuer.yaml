# Let's Encrypt issuer using DNS-01 on the Cloudflare hwkn.dev zone.
# DNS-01 is required because the *.int.hwkn.dev hosts are not reachable from the internet.
# The API token secret lives in the cert-manager namespace (ClusterIssuer secrets are read from
# the cluster resource namespace), see README.md.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - hwkn.dev
