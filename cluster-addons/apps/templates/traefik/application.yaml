apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 41.6.0
    helm:
      releaseName: traefik
      values: |
        {{ .Files.Get "values/traefik.values.yaml" | nindent 8 }}
  destination:
    server: "{{ .Values.spec.destination.server }}"
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # The Traefik CRDs are too large for the last-applied-configuration annotation.
      - ServerSideApply=true
